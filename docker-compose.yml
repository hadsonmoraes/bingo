services:
  app:
    build: .
    container_name: bingo-app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  # Uso pontual: docker compose run --rm node npm install && npm run build
  node:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
